# Test configuration. This file shadows src/main/resources/application.properties
# on the test classpath, so the main file (and its .env import) is NOT loaded.
spring.application.name=QuizAPI

# Explicitly empty: never import the local .env file in tests (no real secrets).
spring.config.import=

# H2 in-memory database in MySQL mode (no MySQL server needed)
spring.datasource.url=jdbc:h2:mem:quiz_db;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Fake key: tests must never call the real AI (QuizGenerator is always mocked).
spring.ai.anthropic.api-key=test-key
# Both AI starters are on the classpath: activate only Anthropic (its ChatModel is unused, QuizGenerator is mocked).
spring.ai.model.chat=anthropic
