# Profile "ollama": use a free local model instead of Claude.
# Run with: ./mvnw spring-boot:run "-Dspring-boot.run.profiles=ollama"
# Requires Ollama running locally (https://ollama.com) and the model pulled: ollama pull qwen2.5:7b
spring.ai.model.chat=ollama
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=qwen2.5:7b
spring.ai.ollama.chat.options.temperature=0.3
